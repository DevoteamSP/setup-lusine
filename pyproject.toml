[project]
name = "setup-lusine"
version = "1.0.0"
description = "Sets up L'Usine, the Devoteam Snowflake Partner hub: sign in to GitHub, download, start"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.scripts]
setup_lusine = "setup_lusine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["setup_lusine.py"]
